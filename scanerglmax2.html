<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLMax Scanner - OCR Professional</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --secondary: #64748b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--primary); margin-top: 0; }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 2rem;
            cursor: pointer;
            transition: border 0.3s;
            margin-bottom: 1rem;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-zone:hover { border-color: var(--primary); }

        #preview {
            max-width: 100%;
            max-height: 200px;
            display: none;
            border-radius: 4px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
            font-size: 0.9rem;
            width: 100%;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-secondary { background-color: var(--secondary); color: white; }

        #btnScan { grid-column: 1 / -1; margin-top: 5px; } /* Botão Extrair ocupa largura total */

        #result-container {
            margin-top: 1.5rem;
            text-align: left;
            position: relative;
        }

        #result {
            background: #f1f5f9;
            padding: 1rem;
            padding-top: 2.5rem; /* Espaço para o botão copiar */
            border-radius: 6px;
            min-height: 100px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            border: 1px solid #e2e8f0;
            color: var(--text);
        }

        #btnCopy {
            position: absolute;
            top: 5px;
            right: 5px;
            width: auto;
            padding: 6px 12px;
            font-size: 0.8rem;
            display: none; /* Escondido até ter texto */
        }

        .loader {
            display: none;
            margin: 15px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>GLMax OCR Scanner</h1>
        
        <div class="button-group">
            <button class="btn-secondary" onclick="document.getElementById('fileInput').click()">Abrir Arquivo</button>
            
            <button class="btn-secondary" onclick="document.getElementById('cameraInput').click()">Tirar Foto</button>
        </div>

        <input type="file" id="fileInput" hidden accept="image/*">
        <input type="file" id="cameraInput" hidden accept="image/*" capture="environment">

        <div class="drop-zone" id="dropZone">
            <span id="dropZoneText">Pré-visualização da imagem</span>
            <img id="preview" alt="Preview">
        </div>

        <button id="btnScan" class="btn-primary">Extrair Texto</button>
        
        <div class="loader" id="loader"></div>

        <div id="result-container">
            <button id="btnCopy" class="btn-success">Copiar</button>
            <div id="result">O texto extraído aparecerá aqui...</div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput');
        const btnScan = document.getElementById('btnScan');
        const btnCopy = document.getElementById('btnCopy');
        const resultDiv = document.getElementById('result');
        const preview = document.getElementById('preview');
        const loader = document.getElementById('loader');
        const dropZoneText = document.getElementById('dropZoneText');

        const API_KEY = 'K86822256088957';
        let currentFile = null;

        // Função para processar o arquivo selecionado
        function handleFile(file) {
            if (file) {
                currentFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    dropZoneText.style.display = 'none';
                    btnScan.disabled = false;
                }
                reader.readAsDataURL(file);
            }
        }

        // Eventos dos Inputs de arquivo
        fileInput.addEventListener('change', function() { handleFile(this.files[0]); });
        cameraInput.addEventListener('change', function() { handleFile(this.files[0]); });

        // Evento do Botão Extrair
        btnScan.addEventListener('click', async () => {
            if (!currentFile) return alert('Por favor, selecione ou tire uma foto primeiro.');

            // Preparar dados para o OCR.space
            const formData = new FormData();
            formData.append('apikey', API_KEY);
            formData.append('language', 'por'); // Português
            formData.append('isOverlayRequired', 'false');
            formData.append('file', currentFile);

            // Interface
            btnScan.disabled = true;
            loader.style.display = 'block';
            resultDiv.innerText = 'Processando...';
            resultDiv.style.color = 'var(--text)';
            btnCopy.style.display = 'none';

            try {
                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.OCRExitCode === 1) {
                    const text = data.ParsedResults[0].ParsedText;
                    if (text && text.trim() !== "") {
                        resultDiv.innerText = text;
                        btnCopy.style.display = 'block'; // Mostra botão copiar
                    } else {
                        resultDiv.innerText = '(Nenhum texto detectado na imagem)';
                        resultDiv.style.color = 'var(--secondary)';
                    }
                } else {
                    resultDiv.innerText = 'Erro do Servidor: ' + data.ErrorMessage;
                    resultDiv.style.color = '#dc2626'; // Vermelho
                }
            } catch (error) {
                resultDiv.innerText = 'Erro na requisição: ' + error.message;
                resultDiv.style.color = '#dc2626';
            } finally {
                btnScan.disabled = false;
                loader.style.display = 'none';
            }
        });

        // Evento do Botão Copiar
        btnCopy.addEventListener('click', () => {
            const textToCopy = resultDiv.innerText;
            
            // Usando a Clipboard API moderna
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnCopy.innerText;
                btnCopy.innerText = 'Copiado!';
                btnCopy.classList.remove('btn-success');
                btnCopy.style.backgroundColor = '#15803d'; // Verde mais escuro temporário
                
                setTimeout(() => {
                    btnCopy.innerText = originalText;
                    btnCopy.classList.add('btn-success');
                    btnCopy.style.backgroundColor = ''; // Restaura cor original
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                alert('Não foi possível copiar o texto automaticamente.');
            });
        });

    </script>
</body>
</html>
