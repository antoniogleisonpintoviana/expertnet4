<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLMax Scanner - Estável</title>
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --bg: #000; }
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; }
        
        /* Área da Foto */
        .viewport { 
            position: relative; 
            width: 100%; 
            height: 350px; 
            background: #333; 
            overflow: hidden; 
            border-radius: 8px; 
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #img-view { max-width: 100%; position: absolute; }

        /* O Quadrado de Recorte Manual */
        #crop-box {
            position: absolute;
            width: 200px;
            height: 80px;
            border: 2px solid #0f0;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); /* Escurece o que está fora */
            z-index: 10;
            display: none;
            touch-action: none;
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-blue { background: var(--primary); color: white; width: 100%; }
        .btn-gray { background: #555; color: white; }
        
        #result { background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; min-height: 50px; border: 1px solid #333; }
        .instrucao { font-size: 0.8rem; color: #aaa; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--primary);">GLMax OCR PRO</h2>
    
    <div class="controls">
        <button class="btn-gray" onclick="document.getElementById('camIn').click()">Câmera</button>
        <button class="btn-gray" onclick="document.getElementById('fileIn').click()">Galeria</button>
    </div>

    <input type="file" id="fileIn" hidden accept="image/*">
    <input type="file" id="camIn" hidden accept="image/*" capture="environment">

    <p class="instrucao">Arraste a foto para posicionar o texto dentro do retângulo verde</p>

    <div class="viewport" id="area">
        <div id="crop-box"></div>
        <img id="img-view" src="" alt="">
    </div>

    <button id="btnScan" class="btn-blue" style="margin-top:10px;">EXTRAIR TEXTO DO VERDE</button>

    <div style="margin-top:15px;">
        <div style="display:flex; justify-content:space-between;">
            <span style="font-size:0.7rem;">RESULTADO:</span>
            <button onclick="copyText()" id="btnCopy" style="background:var(--success); color:white; padding:2px 10px; font-size:0.7rem; display:none;">COPIAR</button>
        </div>
        <div id="result">Aguardando imagem...</div>
    </div>
</div>

<script>
    const img = document.getElementById('img-view');
    const box = document.getElementById('crop-box');
    const result = document.getElementById('result');
    const btnScan = document.getElementById('btnScan');

    // Movimentação da Imagem (Touch/Arraste)
    let isDragging = false;
    let startX, startY, currentX = 0, currentY = 0;

    function handleStart(e) {
        isDragging = true;
        const touch = e.type === 'touchstart' ? e.touches[0] : e;
        startX = touch.clientX - currentX;
        startY = touch.clientY - currentY;
    }

    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.type === 'touchmove' ? e.touches[0] : e;
        currentX = touch.clientX - startX;
        currentY = touch.clientY - startY;
        img.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }

    function handleEnd() { isDragging = false; }

    const area = document.getElementById('area');
    area.addEventListener('mousedown', handleStart);
    area.addEventListener('touchstart', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    // Carregar Imagem
    [document.getElementById('fileIn'), document.getElementById('camIn')].forEach(input => {
        input.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    box.style.display = 'block';
                    currentX = 0; currentY = 0;
                    img.style.transform = `translate(0,0)`;
                    result.innerText = "Posicione o Renavam/Placa no verde";
                };
                reader.readAsDataURL(file);
            }
        });
    });

    // Extrair Texto
    btnScan.addEventListener('click', async () => {
        if (!img.src) return alert("Selecione uma imagem!");
        
        result.innerText = "Lendo...";
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Calculamos o recorte baseado no que está dentro do retângulo verde
        const scale = img.naturalWidth / img.clientWidth;
        const boxRect = box.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();

        const sx = (boxRect.left - imgRect.left) * scale;
        const sy = (boxRect.top - imgRect.top) * scale;
        const sw = boxRect.width * scale;
        const sh = boxRect.height * scale;

        canvas.width = sw;
        canvas.height = sh;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

        const base64 = canvas.toDataURL('image/jpeg', 0.8);
        
        const fd = new FormData();
        fd.append('apikey', 'K86822256088957');
        fd.append('base64Image', base64);
        fd.append('language', 'por');
        fd.append('OCREngine', '2');

        try {
            const resp = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: fd });
            const data = await resp.json();
            const text = data.ParsedResults[0].ParsedText;
            result.innerText = text.trim() || "Não lido. Tente centralizar melhor.";
            document.getElementById('btnCopy').style.display = text.trim() ? 'block' : 'none';
        } catch (e) {
            result.innerText = "Erro na conexão.";
        }
    });

    function copyText() {
        navigator.clipboard.writeText(result.innerText);
        alert("Copiado!");
    }
</script>
</body>
</html>
