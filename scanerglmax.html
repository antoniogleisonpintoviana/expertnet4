<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLMax Scanner - OCR Professional</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--primary); }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 2rem;
            cursor: pointer;
            transition: border 0.3s;
            margin-bottom: 1rem;
        }

        .drop-zone:hover { border-color: var(--primary); }

        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            display: none;
            border-radius: 4px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #result {
            margin-top: 1.5rem;
            text-align: left;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 6px;
            min-height: 100px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            border: 1px solid #e2e8f0;
        }

        .loader {
            display: none;
            margin: 10px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>GLMax OCR Scanner</h1>
        
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <span>Clique ou arraste uma imagem aqui</span>
            <input type="file" id="fileInput" hidden accept="image/*">
            <img id="preview" alt="Preview">
        </div>

        <button id="btnScan">Extrair Texto</button>
        
        <div class="loader" id="loader"></div>
        <div id="result">O texto extraído aparecerá aqui...</div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const btnScan = document.getElementById('btnScan');
        const resultDiv = document.getElementById('result');
        const preview = document.getElementById('preview');
        const loader = document.getElementById('loader');

        const API_KEY = 'K86822256088957';

        // Preview da imagem
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        btnScan.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert('Por favor, selecione uma imagem primeiro.');

            // Preparar dados para o OCR.space
            const formData = new FormData();
            formData.append('apikey', API_KEY);
            formData.append('language', 'por'); // Português
            formData.append('isOverlayRequired', 'false');
            formData.append('file', file);

            // Interface
            btnScan.disabled = true;
            loader.style.display = 'block';
            resultDiv.innerText = 'Processando...';

            try {
                const response = await fetch('https://api.ocr.space/parse/image', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.OCRExitCode === 1) {
                    resultDiv.innerText = data.ParsedResults[0].ParsedText;
                } else {
                    resultDiv.innerText = 'Erro: ' + data.ErrorMessage;
                }
            } catch (error) {
                resultDiv.innerText = 'Erro na requisição: ' + error.message;
            } finally {
                btnScan.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
