<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLMax Scanner - Google Vision PRO</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --bg: #000; }
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; }
        .viewport { position: relative; width: 100%; height: 350px; background: #333; overflow: hidden; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; touch-action: none; }
        #img-view { max-width: 100%; position: absolute; cursor: move; transition: transform 0.1s ease-out; }
        #crop-box { position: absolute; width: 200px; height: 80px; border: 2px solid #0f0; box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); z-index: 10; display: none; pointer-events: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: var(--primary); color: white; width: 100%; }
        .btn-gray { background: #555; color: white; }
        #result { background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; min-height: 50px; border: 1px solid #333; word-break: break-all; white-space: pre-wrap; font-size: 1.1rem; }
        .instrucao { font-size: 0.75rem; color: #aaa; text-align: center; margin-bottom: 10px; }
        #progress-container { width: 100%; background: #333; height: 4px; border-radius: 2px; margin-bottom: 10px; display: none; overflow: hidden; }
        #progress-bar { width: 100%; height: 100%; background: var(--primary); animation: loading 2s infinite linear; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--primary);">GLMax OCR (Google Vision)</h2>
    
    <div class="controls">
        <button class="btn-gray" onclick="document.getElementById('camIn').click()">Câmera</button>
        <button class="btn-gray" onclick="document.getElementById('fileIn').click()">Galeria</button>
    </div>

    <input type="file" id="fileIn" hidden accept="image/*">
    <input type="file" id="camIn" hidden accept="image/*" capture="environment">

    <p class="instrucao">Posicione o texto dentro do quadro verde</p>

    <div class="viewport" id="area">
        <div id="crop-box"></div>
        <img id="img-view" src="" alt="">
    </div>
    
    <div id="progress-container"><div id="progress-bar"></div></div>

    <button id="btnScan" class="btn-blue">EXTRAIR COM GOOGLE LENS</button>

    <div style="margin-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 5px;">
            <span style="font-size:0.7rem;">RESULTADO:</span>
            <button onclick="copyText()" id="btnCopy" style="background:var(--success); color:white; padding:4px 10px; font-size:0.7rem; display:none; border-radius:4px;">COPIAR</button>
        </div>
        <div id="result">Aguardando imagem...</div>
    </div>
</div>

<script>
    // --- SUA CHAVE GOOGLE CLOUD ---
    const GOOGLE_API_KEY = "AIzaSyCSA6b98dcd5XsG8WgfcTmLVWuMGefihWs"; 

    const img = document.getElementById('img-view');
    const box = document.getElementById('crop-box');
    const result = document.getElementById('result');
    const btnScan = document.getElementById('btnScan');
    const progressContainer = document.getElementById('progress-container');

    let isDragging = false;
    let startX, startY, currentX = 0, currentY = 0;

    // Movimentação da imagem
    function handleStart(e) {
        if(!img.src) return;
        isDragging = true;
        const touch = e.type === 'touchstart' ? e.touches[0] : e;
        startX = touch.clientX - currentX;
        startY = touch.clientY - currentY;
    }
    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.type === 'touchmove' ? e.touches[0] : e;
        currentX = touch.clientX - startX;
        currentY = touch.clientY - startY;
        img.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }
    function handleEnd() { isDragging = false; }

    const area = document.getElementById('area');
    area.addEventListener('mousedown', handleStart);
    area.addEventListener('touchstart', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    // Ajuste do quadro verde com setas
    window.addEventListener('keydown', (e) => {
        if (!img.src) return;
        let w = box.offsetWidth;
        let h = box.offsetHeight;
        if (e.key === 'ArrowUp') { box.style.height = (h + 10) + 'px'; e.preventDefault(); }
        if (e.key === 'ArrowDown') { box.style.height = Math.max(20, h - 10) + 'px'; e.preventDefault(); }
        if (e.key === 'ArrowRight') { box.style.width = (w + 10) + 'px'; e.preventDefault(); }
        if (e.key === 'ArrowLeft') { box.style.width = Math.max(20, w - 10) + 'px'; e.preventDefault(); }
    });

    // Carregar imagem
    [document.getElementById('fileIn'), document.getElementById('camIn')].forEach(input => {
        input.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    box.style.display = 'block';
                    currentX = 0; currentY = 0;
                    img.style.transform = `translate(0,0)`;
                    result.innerText = "Imagem carregada. Ajuste e Extraia.";
                };
                reader.readAsDataURL(file);
            }
        });
    });

    // Extração usando Google Cloud Vision
    btnScan.addEventListener('click', async () => {
        if (!img.src) return alert("Selecione uma imagem!");
        
        btnScan.disabled = true;
        btnScan.innerText = "GOOGLE ANALISANDO...";
        progressContainer.style.display = 'block';

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = img.naturalWidth / img.clientWidth;
        const boxRect = box.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();

        canvas.width = boxRect.width * scale;
        canvas.height = boxRect.height * scale;
        
        ctx.drawImage(img, 
            (boxRect.left - imgRect.left) * scale, 
            (boxRect.top - imgRect.top) * scale, 
            canvas.width, canvas.height, 
            0, 0, canvas.width, canvas.height
        );

        // Converte o recorte para Base64 para o Google
        const base64Image = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];

        const requestBody = {
            requests: [{
                image: { content: base64Image },
                features: [{ type: "TEXT_DETECTION" }]
            }]
        };

        try {
            const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            if (data.responses && data.responses[0].fullTextAnnotation) {
                result.innerText = data.responses[0].fullTextAnnotation.text;
                document.getElementById('btnCopy').style.display = 'block';
            } else {
                result.innerText = "Google não encontrou texto claro no recorte.";
            }
        } catch (error) {
            console.error(error);
            result.innerText = "Erro ao conectar com o Google. Verifique sua chave.";
        } finally {
            btnScan.disabled = false;
            btnScan.innerText = "EXTRAIR COM GOOGLE LENS";
            progressContainer.style.display = 'none';
        }
    });

    function copyText() {
        navigator.clipboard.writeText(result.innerText);
        alert("Texto copiado!");
    }
</script>
</body>
</html>
