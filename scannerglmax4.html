<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLMax Scanner - IA PRO</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --bg: #000; }
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; }
        
        .viewport { 
            position: relative; 
            width: 100%; 
            height: 350px; 
            background: #333; 
            overflow: hidden; 
            border-radius: 8px; 
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #img-view { max-width: 100%; position: absolute; cursor: move; transition: transform 0.1s ease-out; }

        #crop-box {
            position: absolute;
            width: 200px;
            height: 80px;
            border: 2px solid #0f0;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.6);
            z-index: 10;
            display: none;
            pointer-events: none; 
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-blue { background: var(--primary); color: white; width: 100%; }
        .btn-gray { background: #555; color: white; }
        
        #result { background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; min-height: 50px; border: 1px solid #333; word-break: break-all; white-space: pre-wrap; font-size: 1.1rem; }
        .instrucao { font-size: 0.75rem; color: #aaa; text-align: center; margin-bottom: 10px; }
        
        #progress-container { width: 100%; background: #333; height: 4px; border-radius: 2px; margin-bottom: 10px; display: none; overflow: hidden; }
        #progress-bar { width: 100%; height: 100%; background: var(--primary); animation: loading 2s infinite linear; }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--primary);">GLMax OCR IA (Python)</h2>
    
    <div class="controls">
        <button class="btn-gray" onclick="document.getElementById('camIn').click()">Câmera</button>
        <button class="btn-gray" onclick="document.getElementById('fileIn').click()">Galeria</button>
    </div>

    <input type="file" id="fileIn" hidden accept="image/*">
    <input type="file" id="camIn" hidden accept="image/*" capture="environment">

    <p class="instrucao">Arraste a foto e ajuste o quadro verde (setas no PC)</p>

    <div class="viewport" id="area">
        <div id="crop-box"></div>
        <img id="img-view" src="" alt="">
    </div>
    
    <div id="progress-container"><div id="progress-bar"></div></div>

    <button id="btnScan" class="btn-blue">EXTRAIR TEXTO COM IA</button>

    <div style="margin-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 5px;">
            <span style="font-size:0.7rem;">RESULTADO:</span>
            <button onclick="copyText()" id="btnCopy" style="background:var(--success); color:white; padding:4px 10px; font-size:0.7rem; display:none; border-radius:4px;">COPIAR</button>
        </div>
        <div id="result">Aguardando imagem...</div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO DA IA ---
    const HF_TOKEN = "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"; 

    const img = document.getElementById('img-view');
    const box = document.getElementById('crop-box');
    const result = document.getElementById('result');
    const btnScan = document.getElementById('btnScan');
    const progressContainer = document.getElementById('progress-container');

    let isDragging = false;
    let startX, startY, currentX = 0, currentY = 0;

    // --- LÓGICA DE MOVIMENTAÇÃO ---
    function handleStart(e) {
        if(!img.src) return;
        isDragging = true;
        const touch = e.type === 'touchstart' ? e.touches[0] : e;
        startX = touch.clientX - currentX;
        startY = touch.clientY - currentY;
    }
    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.type === 'touchmove' ? e.touches[0] : e;
        currentX = touch.clientX - startX;
        currentY = touch.clientY - startY;
        img.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }
    function handleEnd() { isDragging = false; }

    const area = document.getElementById('area');
    area.addEventListener('mousedown', handleStart);
    area.addEventListener('touchstart', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    // --- AJUSTE COM SETAS ---
    window.addEventListener('keydown', (e) => {
        if (!img.src) return;
        let w = box.offsetWidth;
        let h = box.offsetHeight;
        if (e.key === 'ArrowUp') { box.style.height = (h + 10) + 'px'; e.preventDefault(); }
