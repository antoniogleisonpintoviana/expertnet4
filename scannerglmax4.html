<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLMax Scanner - Tesseract</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root { --primary: #2563eb; --success: #16a34a; --bg: #000; }
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; }
        
        .viewport { 
            position: relative; 
            width: 100%; 
            height: 350px; 
            background: #333; 
            overflow: hidden; 
            border-radius: 8px; 
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none; /* Melhora o arraste no mobile */
        }
        #img-view { max-width: 100%; position: absolute; cursor: move; }

        #crop-box {
            position: absolute;
            width: 200px;
            height: 80px;
            border: 2px solid #0f0;
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.6);
            z-index: 10;
            display: none;
            pointer-events: none; 
        }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-blue { background: var(--primary); color: white; width: 100%; }
        .btn-gray { background: #555; color: white; }
        
        #result { background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; min-height: 50px; border: 1px solid #333; word-break: break-all; white-space: pre-wrap; }
        .instrucao { font-size: 0.75rem; color: #aaa; text-align: center; margin-bottom: 10px; }
        
        #progress-container { width: 100%; background: #333; height: 4px; border-radius: 2px; margin-bottom: 10px; display: none; }
        #progress { width: 0%; height: 100%; background: var(--success); transition: width 0.2s; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--primary);">GLMax OCR PRO</h2>
    
    <div class="controls">
        <button class="btn-gray" onclick="document.getElementById('camIn').click()">Câmera</button>
        <button class="btn-gray" onclick="document.getElementById('fileIn').click()">Galeria</button>
    </div>

    <input type="file" id="fileIn" hidden accept="image/*">
    <input type="file" id="camIn" hidden accept="image/*" capture="environment">

    <p class="instrucao">Arraste a foto e use as setas do teclado para ajustar o quadro verde</p>

    <div class="viewport" id="area">
        <div id="crop-box"></div>
        <img id="img-view" src="" alt="">
    </div>
    
    <div id="progress-container"><div id="progress"></div></div>

    <button id="btnScan" class="btn-blue">EXTRAIR TEXTO</button>

    <div style="margin-top:15px;">
        <div style="display:flex; justify-content:space-between; align-items: center; margin-bottom: 5px;">
            <span style="font-size:0.7rem;">RESULTADO:</span>
            <button onclick="copyText()" id="btnCopy" style="background:var(--success); color:white; padding:4px 10px; font-size:0.7rem; display:none; border-radius:4px;">COPIAR</button>
        </div>
        <div id="result">Aguardando imagem...</div>
    </div>
</div>

<script>
    const img = document.getElementById('img-view');
    const box = document.getElementById('crop-box');
    const result = document.getElementById('result');
    const btnScan = document.getElementById('btnScan');
    const progressBar = document.getElementById('progress');
    const progressContainer = document.getElementById('progress-container');

    let isDragging = false;
    let startX, startY, currentX = 0, currentY = 0;

    // --- MOVIMENTAÇÃO ---
    function handleStart(e) {
        if(!img.src) return;
        isDragging = true;
        const touch = e.type === 'touchstart' ? e.touches[0] : e;
        startX = touch.clientX - currentX;
        startY = touch.clientY - currentY;
    }
    function handleMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.type === 'touchmove' ? e.touches[0] : e;
        currentX = touch.clientX - startX;
        currentY = touch.clientY - startY;
        img.style.transform = `translate(${currentX}px, ${currentY}px)`;
    }
    function handleEnd() { isDragging = false; }

    const area = document.getElementById('area');
    area.addEventListener('mousedown', handleStart);
    area.addEventListener('touchstart', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    // --- CONTROLE DO CROP COM SETAS ---
    window.addEventListener('keydown', (e) => {
        if (!img.src) return;
        let w = box.offsetWidth;
        let h = box.offsetHeight;
        const step = 10;

        if (e.key === 'ArrowUp') { box.style.height = (h + step) + 'px'; e.preventDefault(); }
        if (e.key === 'ArrowDown') { box.style.height = Math.max(20, h - step) + 'px'; e.preventDefault(); }
        if (e.key === 'ArrowRight') { box.style.width = (w + step) + 'px'; e.preventDefault(); }
        if (e.key === 'ArrowLeft') { box.style.width = Math.max(20, w - step) + 'px'; e.preventDefault(); }
    });

    // --- CARREGAR IMAGEM ---
    [document.getElementById('fileIn'), document.getElementById('camIn')].forEach(input => {
        input.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.src = ev.target.result;
                    box.style.display = 'block';
                    currentX = 0; currentY = 0;
                    img.style.transform = `translate(0,0)`;
                    result.innerText = "Imagem carregada. Ajuste o texto no verde.";
                    progressContainer.style.display = 'none';
                    progressBar.style.width = "0%";
                };
                reader.readAsDataURL(file);
            }
        });
    });

    // --- EXTRAÇÃO OCR ---
    btnScan.addEventListener('click', async () => {
        if (!img.src) return alert("Selecione uma imagem!");
        
        btnScan.disabled = true;
        result.innerText = "Carregando motor OCR...";
        progressContainer.style.display = 'block';
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        const scale = img.naturalWidth / img.clientWidth;
        const boxRect = box.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();

        const sx = (boxRect.left - imgRect.left) * scale;
        const sy = (boxRect.top - imgRect.top) * scale;
        const sw = boxRect.width * scale;
        const sh = boxRect.height * scale;

        canvas.width = sw;
        canvas.height = sh;
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

        try {
            // Inicializa o Worker do Tesseract
            const worker = await Tesseract.createWorker('por', 1, {
                logger: m => {
                    if(m.status === 'recognizing text') {
                        progressBar.style.width = (m.progress * 100) + "%";
                        result.innerText = `Lendo: ${Math.round(m.progress * 100)}%`;
                    }
                }
            });

            const { data: { text } } = await worker.recognize(canvas);
            
            result.innerText = text.trim() || "Não foi possível ler nada.";
            document.getElementById('btnCopy').style.display = text.trim() ? 'block' : 'none';
            
            await worker.terminate();
        } catch (e) {
            console.error(e);
            result.innerText = "ERRO: O Tesseract precisa rodar em um servidor (http://) e não direto do arquivo (file://). Suba para o GitHub para testar.";
        } finally {
            btnScan.disabled = false;
        }
    });

    function copyText() {
        navigator.clipboard.writeText(result.innerText);
    }
</script>
</body>
</html>
