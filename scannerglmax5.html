<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLMax Scanner - IA Webcam</title>
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --bg: #000; }
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 450px; }
        .viewport { position: relative; width: 100%; height: 350px; background: #333; overflow: hidden; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; }
        #video-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
        #img-view { max-width: 100%; position: absolute; cursor: move; }
        #crop-box { position: absolute; width: 220px; height: 90px; border: 2px solid #0f0; box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); z-index: 10; display: none; pointer-events: none; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        button { border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-blue { background: var(--primary); color: white; width: 100%; }
        .btn-gray { background: #555; color: white; }
        #result { background: #000; color: #0f0; padding: 15px; border-radius: 8px; font-family: monospace; min-height: 50px; border: 1px solid #333; word-break: break-all; font-size: 1.1rem; }
        #progress-container { width: 100%; background: #333; height: 4px; display: none; overflow: hidden; }
        #progress-bar { width: 100%; height: 100%; background: var(--primary); animation: loading 2s infinite linear; }
        @keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--primary);">GLMax Scanner (Webcam PC)</h2>
    
    <div class="controls">
        <button id="btnCam" class="btn-gray" onclick="toggleCamera()">Abrir Câmera</button>
        <button class="btn-gray" onclick="document.getElementById('fileIn').click()">Galeria</button>
    </div>

    <input type="file" id="fileIn" hidden accept="image/*">

    <div class="viewport" id="area">
        <video id="video-preview" autoplay playsinline></video>
        <div id="crop-box"></div>
        <img id="img-view" src="">
    </div>
    
    <div id="progress-container"><div id="progress-bar"></div></div>

    <button id="btnScan" class="btn-blue">EXTRAIR COM GOOGLE VISION</button>

    <div style="margin-top:15px;">
        <div id="result">Aguardando imagem ou câmera...</div>
    </div>
</div>

<script>
    const GOOGLE_API_KEY = "AIzaSyCSA6b98dcd5XsG8WgfcTmLVWuMGefihWs"; 
    const video = document.getElementById('video-preview');
    const img = document.getElementById('img-view');
    const box = document.getElementById('crop-box');
    const result = document.getElementById('result');
    const btnScan = document.getElementById('btnScan');
    const btnCam = document.getElementById('btnCam');

    let stream = null;

    // Ligar/Desligar Webcam
    async function toggleCamera() {
        if (stream) {
            capturePhoto();
        } else {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.style.display = 'block';
                img.style.display = 'none';
                box.style.display = 'block';
                btnCam.innerText = "CAPTURAR FOTO";
                result.innerText = "Posicione o documento na frente da webcam.";
            } catch (err) {
                alert("Erro ao acessar webcam. Verifique as permissões.");
            }
        }
    }

    function capturePhoto() {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        img.src = canvas.toDataURL('image/jpeg');
        img.style.display = 'block';
        video.style.display = 'none';
        
        // Desligar a câmera para economizar energia
        stream.getTracks().forEach(track => track.stop());
        stream = null;
        btnCam.innerText = "Abrir Câmera";
    }

    // Carregar da Galeria (PC ou Celular)
    document.getElementById('fileIn').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                img.src = ev.target.result;
                img.style.display = 'block';
                video.style.display = 'none';
                box.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // Lógica do Google Vision (Mesma de antes)
    btnScan.addEventListener('click', async () => {
        if (!img.src) return alert("Capture ou selecione uma imagem!");
        
        btnScan.disabled = true;
        document.getElementById('progress-container').style.display = 'block';

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = img.naturalWidth / img.clientWidth;
        const boxRect = box.getBoundingClientRect();
        const imgRect = img.getBoundingClientRect();

        canvas.width = boxRect.width * scale;
        canvas.height = boxRect.height * scale;
        
        ctx.drawImage(img, (boxRect.left - imgRect.left) * scale, (boxRect.top - imgRect.top) * scale, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);

        const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];

        try {
            const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    requests: [{ image: { content: base64Image }, features: [{ type: "TEXT_DETECTION" }] }]
                })
            });
            const data = await response.json();
            result.innerText = data.responses[0].fullTextAnnotation?.text || "Texto não detectado.";
        } catch (e) {
            result.innerText = "Erro na API.";
        } finally {
            btnScan.disabled = false;
            document.getElementById('progress-container').style.display = 'none';
        }
    });
</script>
</body>
</html>
