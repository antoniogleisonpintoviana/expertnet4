<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fotos 3x4 com Preview</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        padding: 20px;
    }

    h2 {
        color: #02376E;
    }

    input {
        margin: 15px;
    }

    button {
        padding: 10px 20px;
        background: #0566B1;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        margin: 5px;
    }

    button:hover {
        background: #02376E;
    }

    canvas {
        border: 2px solid #ccc;
        background: white;
        margin-top: 20px;
        max-width: 100%;
    }
</style>
</head>

<body>

<h2>Gerador de Fotos 3x4</h2>

<input type="file" id="upload" accept="image/*">
<br>

<button onclick="gerar()">Gerar Preview</button>
<button onclick="baixarPDF()">Baixar PDF</button>

<br>
<canvas id="canvas"></canvas>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let config = {
    dpi: 300,
    quantidade: 6
};

function cmToPx(cm) {
    return (cm * config.dpi) / 2.54;
}

function gerar() {
    const fileInput = document.getElementById('upload');

    if (!fileInput.files[0]) {
        alert("Selecione uma imagem!");
        return;
    }

    const img = new Image();

    img.onload = function () {

        const larguraFoto = cmToPx(3);
        const alturaFoto = cmToPx(4);
        const espaco = cmToPx(0.1);

        canvas.width = (larguraFoto * config.quantidade) + (espaco * (config.quantidade - 1));
        canvas.height = alturaFoto;

        // fundo branco
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < config.quantidade; i++) {
            let x = i * (larguraFoto + espaco);

            let proporcao = larguraFoto / alturaFoto;
            let larguraCrop, alturaCrop;

            if (img.width / img.height > proporcao) {
                alturaCrop = img.height;
                larguraCrop = alturaCrop * proporcao;
            } else {
                larguraCrop = img.width;
                alturaCrop = larguraCrop / proporcao;
            }

            let sx = (img.width - larguraCrop) / 2;
            let sy = (img.height - alturaCrop) / 2;

            ctx.drawImage(
                img,
                sx, sy, larguraCrop, alturaCrop,
                x, 0, larguraFoto, alturaFoto
            );

            // ===== BORDA PRETA =====
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2; // linha fina
            ctx.strokeRect(x, 0, larguraFoto, alturaFoto);
        }
    };

    img.src = URL.createObjectURL(fileInput.files[0]);
}

function baixarPDF() {
    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
        orientation: "landscape",
        unit: "cm",
        format: "a4"
    });

    const imgData = canvas.toDataURL("image/jpeg", 1.0);

    const larguraTotalCm = 3 * config.quantidade + (0.1 * (config.quantidade - 1));
    const alturaTotalCm = 4;

    pdf.addImage(
        imgData,
        "JPEG",
        1,
        1,
        larguraTotalCm,
        alturaTotalCm
    );

    pdf.save("fotos_3x4.pdf");
}
</script>
<a href="index.html">Voltar</a>
</body>
</html>
