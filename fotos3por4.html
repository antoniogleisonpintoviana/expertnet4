<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fotos 3x4 com Varinha Mágica</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #f4f4f4;
}

canvas {
    border: 2px solid #ccc;
    margin-top: 10px;
    max-width: 100%;
}

button {
    padding: 10px;
    margin: 5px;
    background: #0566B1;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Fotos 3x4</h2>

<input type="file" id="upload">
<br>

<canvas id="canvas"></canvas>

<br>
<button onclick="gerar()">Gerar Preview</button>
<button onclick="baixarPDF()">Baixar PDF</button>

<br>
<canvas id="preview"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const preview = document.getElementById("preview");
const ctxPreview = preview.getContext("2d");

const upload = document.getElementById("upload");

let config = {
    dpi: 300,
    quantidade: 6
};

// ===== CARREGAR IMAGEM =====
upload.onchange = function(){
    const img = new Image();
    img.src = URL.createObjectURL(upload.files[0]);

    img.onload = function(){
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img,0,0);
    }
};



// ===== CONVERSÃO =====
function cmToPx(cm) {
    return (cm * config.dpi) / 2.54;
}

// ===== GERAR 3x4 =====
function gerar(){

    const larguraFoto = cmToPx(3);
    const alturaFoto = cmToPx(4);
    const espaco = cmToPx(0.1);

    preview.width = (larguraFoto * config.quantidade) + (espaco * (config.quantidade - 1));
    preview.height = alturaFoto;

    ctxPreview.fillStyle = "white";
    ctxPreview.fillRect(0, 0, preview.width, preview.height);

    for (let i = 0; i < config.quantidade; i++) {

        let x = i * (larguraFoto + espaco);

        ctxPreview.drawImage(
            canvas, // 🔥 usa o canvas editado
            0, 0, canvas.width, canvas.height,
            x, 0, larguraFoto, alturaFoto
        );

        ctxPreview.strokeStyle = "black";
        ctxPreview.strokeRect(x, 0, larguraFoto, alturaFoto);
    }
}

// ===== PDF =====
function baixarPDF() {
    const { jsPDF } = window.jspdf;

    const pdf = new jsPDF({
        orientation: "portrait",
        unit: "cm",
        format: "a4"
    });

    const imgData = preview.toDataURL("image/jpeg", 1.0);

    const larguraTotalCm = 3 * config.quantidade + (0.1 * (config.quantidade - 1));

    pdf.addImage(imgData, "JPEG", 1, 1, larguraTotalCm, 4);

    pdf.save("fotos_3x4.pdf");
}
</script>

</body>
</html>
