<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GLMax 3x4 Pro - Teclado Ativo</title>
    <style>
        :root { --primary: #0566B1; }
        body { font-family: sans-serif; text-align: center; background: #f2f2f2; margin: 0; padding: 10px; overflow-x: hidden; }
        .container { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .canvas-wrapper { position: relative; width: 354px; height: 472px; margin: auto; border: 2px solid #333; overflow: hidden; background: #fff; }
        .crop-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border: 40px solid rgba(0,0,0,0.4); box-sizing: border-box; }
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 15px 0; }
        button { padding: 12px 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; background: #ddd; transition: 0.2s; }
        button:hover { background: #ccc; }
        .btn-main { background: var(--primary); color: white; grid-column: span 4; font-size: 16px; padding: 15px; margin-top: 10px; }
        .btn-bg { background: #00ca6d !important; color: white; grid-column: span 4; font-size: 14px; }
        #loading { display: none; color: #0566B1; font-weight: bold; padding: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        .teclado-info { font-size: 10px; color: #888; margin-bottom: 10px; }
        #canvas-grade { max-width: 100%; border: 1px solid #ccc; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color:#333;">GLMax 3x4 Profissional</h2>
    <div class="teclado-info">Use as <b>Setas</b> para mover e <b>+ / -</b> para o zoom</div>
    
    <input type="file" id="upload" accept="image/*" style="margin-bottom: 15px;">
    
    <div id="loading">🚀 IA EM AÇÃO... AGUARDE</div>
    
    <div class="canvas-wrapper">
        <canvas id="canvas" width="354" height="472"></canvas>
        <div class="crop-mask"></div>
    </div>

    <div class="controls">
        <button onclick="ajustarZoom(1.1)">ZOOM (+)</button>
        <button onclick="ajustarZoom(0.9)">ZOOM (-)</button>
        <button onclick="mover(0, -10)">CIMA</button>
        <button onclick="mover(0, 10)">BAIXO</button>
        <button onclick="mover(-10, 0)">ESQ.</button>
        <button onclick="mover(10, 0)">DIR.</button>
        <button id="btnBg" onclick="removerFundoAPI()" class="btn-bg">REMOVER FUNDO INSTANTÂNEO</button>
    </div>

    <button onclick="gerarGrade()" class="btn-main">GERAR PREVIEW 3x4</button>

    <div id="preview-final" style="display:none; margin-top:20px;">
        <canvas id="canvas-grade"></canvas>
        <button onclick="baixarPDF()" style="background:#000; color:white; width:100%; padding:18px; margin-top:15px; border-radius: 8px; font-weight: bold; cursor:pointer;">BAIXAR PDF PARA IMPRESSÃO</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let imgInput = new Image();
    let zoom = 1.0;
    let posX = 0, posY = 0;

    const apiKey = "MxDhSaXwo3q29moQmbCTxepz";

    // --- CONTROLES POR TECLADO ---
    window.addEventListener("keydown", (e) => {
        if (!imgInput.src) return;
        switch(e.key) {
            case "ArrowUp": mover(0, -5); e.preventDefault(); break;
            case "ArrowDown": mover(0, 5); e.preventDefault(); break;
            case "ArrowLeft": mover(-5, 0); e.preventDefault(); break;
            case "ArrowRight": mover(5, 0); e.preventDefault(); break;
            case "+": case "=": ajustarZoom(1.02); e.preventDefault(); break;
            case "-": case "_": ajustarZoom(0.98); e.preventDefault(); break;
        }
    });

    document.getElementById("upload").onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            imgInput.src = ev.target.result;
            imgInput.onload = () => { 
                zoom = canvas.width / imgInput.width; 
                posX = 0; posY = 0;
                desenhar(); 
            };
        };
        reader.readAsDataURL(file);
    };

    function desenhar() {
        ctx.fillStyle = "white"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if(imgInput.src) {
            ctx.drawImage(imgInput, posX, posY, imgInput.width * zoom, imgInput.height * zoom);
        }
    }

    function ajustarZoom(f) { zoom *= f; desenhar(); }
    function mover(dx, dy) { posX += dx; posY += dy; desenhar(); }

    async function removerFundoAPI() {
        if (!imgInput.src) return alert("Selecione uma foto!");
        const loader = document.getElementById("loading");
        const btn = document.getElementById("btnBg");
        loader.style.display = "block";
        btn.disabled = true;

        try {
            const res = await fetch(imgInput.src);
            const blob = await res.blob();
            const formData = new FormData();
            formData.append("image_file", blob, "foto.png");
            formData.append("size", "auto");

            const response = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST",
                headers: { "X-Api-Key": apiKey },
                body: formData
            });

            if (response.ok) {
                const resultBlob = await response.blob();
                imgInput.src = URL.createObjectURL(resultBlob);
                imgInput.onload = () => { 
                    desenhar(); 
                    loader.style.display = "none";
                    btn.disabled = false;
                };
            } else {
                const erro = await response.json();
                alert("Erro: " + erro.errors[0].title);
                loader.style.display = "none";
                btn.disabled = false;
            }
        } catch (e) {
            alert("Falha na conexão.");
            loader.style.display = "none";
            btn.disabled = false;
        }
    }

    // ===== GERAR GRADE NA TELA (PREVIEW) =====
    function gerarGrade() {
        const cGrade = document.getElementById("canvas-grade");
        const ctxG = cGrade.getContext("2d");
        const fotoW = 354, fotoH = 472, gap = 15;
        
        cGrade.width = (fotoW * 3) + (gap * 2);
        cGrade.height = (fotoH * 2) + gap;
        
        ctxG.fillStyle = "white";
        ctxG.fillRect(0, 0, cGrade.width, cGrade.height);
        
        for (let i = 0; i < 6; i++) {
            let x = (i % 3) * (fotoW + gap);
            let y = Math.floor(i / 3) * (fotoH + gap);
            ctxG.drawImage(canvas, x, y, fotoW, fotoH);
            
            // Borda fina para o corte no preview
            ctxG.strokeStyle = "#ccc";
            ctxG.strokeRect(x, y, fotoW, fotoH);
        }
        document.getElementById("preview-final").style.display = "block";
    }

    // ===== BAIXAR PDF (MEDIDAS REAIS PARA IMPRESSÃO) =====
    function baixarPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
        orientation: "p",
        unit: "cm",
        format: "a4"
    });

    const larguraFotoCm = 3;
    const alturaFotoCm = 4;
    const margemX = 1.0; // Margem da lateral da folha
    const margemY = 1.0; // Margem do topo da folha
    const espaco = 0.1;  // Espaço mínimo entre as fotos para corte

    // Pega a imagem do canvas principal (onde você ajustou o zoom e posição)
    const imgData = canvas.toDataURL("image/jpeg", 1.0);

    // Organiza as 6 fotos em 2 linhas de 3 fotos cada (Economiza muito espaço)
    for (let i = 0; i < 6; i++) {
        let col = i % 3;            // Coluna 0, 1 ou 2
        let lin = Math.floor(i / 3); // Linha 0 ou 1
        
        let posX = margemX + (col * (larguraFotoCm + espaco));
        let posY = margemY + (lin * (alturaFotoCm + espaco));

        // Adiciona a foto no tamanho real 3x4cm sem esticar
        pdf.addImage(imgData, "JPEG", posX, posY, larguraFotoCm, alturaFotoCm);
        
        // Borda fininha para ajudar você a cortar na guilhotina
        pdf.setDrawColor(200);
        pdf.setLineWidth(0.01);
        pdf.rect(posX, posY, larguraFotoCm, alturaFotoCm);
    }

    pdf.save("fotos_3x4_organizadas.pdf");
}
</script>
</body>
</html>
