<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>GLMax 3x4 Pro - API Ativa</title>
    <style>
        :root { --primary: #0566B1; }
        body { font-family: sans-serif; text-align: center; background: #f2f2f2; margin: 0; padding: 10px; }
        .container { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .canvas-wrapper { position: relative; width: 354px; height: 472px; margin: auto; border: 2px solid #333; overflow: hidden; background: #fff; }
        .crop-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; border: 40px solid rgba(0,0,0,0.4); box-sizing: border-box; }
        .controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 15px 0; }
        button { padding: 12px 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; background: #ddd; transition: 0.2s; }
        button:hover { background: #ccc; }
        .btn-main { background: var(--primary); color: white; grid-column: span 4; font-size: 16px; padding: 15px; margin-top: 10px; }
        .btn-bg { background: #00ca6d !important; color: white; grid-column: span 4; font-size: 14px; }
        #loading { display: none; color: #0566B1; font-weight: bold; padding: 10px; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        canvas { display: block; margin: auto; max-width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color:#333;">GLMax 3x4 Profissional</h2>
    <input type="file" id="upload" accept="image/*" style="margin-bottom: 15px; font-size: 14px;">
    
    <div id="loading">🚀 IA EM AÇÃO... AGUARDE</div>
    
    <div class="canvas-wrapper">
        <canvas id="canvas" width="354" height="472"></canvas>
        <div class="crop-mask"></div>
    </div>

    <div class="controls">
        <button onclick="ajustarZoom(1.1)">ZOOM +</button>
        <button onclick="ajustarZoom(0.9)">ZOOM -</button>
        <button onclick="mover(0, -15)">CIMA</button>
        <button onclick="mover(0, 15)">BAIXO</button>
        <button onclick="mover(-15, 0)">ESQ.</button>
        <button onclick="mover(15, 0)">DIR.</button>
        <button id="btnBg" onclick="removerFundoAPI()" class="btn-bg">REMOVER FUNDO INSTANTÂNEO</button>
    </div>

    <button onclick="gerarGrade()" class="btn-main">GERAR FOLHA PARA IMPRESSÃO</button>

    <div id="preview-final" style="display:none; margin-top:20px; border-top: 2px dashed #ccc; padding-top: 20px;">
        <canvas id="canvas-grade"></canvas>
        <button onclick="baixarPDF()" style="background:#000; color:white; width:100%; padding:18px; margin-top:15px; border-radius: 8px; font-weight: bold; cursor:pointer;">BAIXAR PDF (TAMANHO A4)</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let imgInput = new Image();
    let zoom = 1.0;
    let posX = 0, posY = 0;

    // SUA CHAVE CONFIGURADA
    const apiKey = "MxDhSaXwo3q29moQmbCTxepz";

    document.getElementById("upload").onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            imgInput.src = ev.target.result;
            imgInput.onload = () => { 
                zoom = canvas.width / imgInput.width; 
                posX = 0; posY = 0;
                desenhar(); 
            };
        };
        reader.readAsDataURL(file);
    };

    function desenhar() {
        ctx.fillStyle = "white"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if(imgInput.src) {
            ctx.drawImage(imgInput, posX, posY, imgInput.width * zoom, imgInput.height * zoom);
        }
    }

    function ajustarZoom(f) { zoom *= f; desenhar(); }
    function mover(dx, dy) { posX += dx; posY += dy; desenhar(); }

    async function removerFundoAPI() {
        if (!imgInput.src) return alert("Selecione uma foto primeiro!");

        const loader = document.getElementById("loading");
        const btn = document.getElementById("btnBg");
        
        loader.style.display = "block";
        btn.disabled = true;
        btn.style.opacity = "0.5";

        const base64Image = imgInput.src.split(",")[1];
        const formData = new FormData();
        formData.append("image_file_b64", base64Image);
        formData.append("size", "auto");

        try {
            const response = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST",
                headers: { "X-Api-Key": apiKey },
                body: formData
            });

            if (response.ok) {
                const blob = await response.blob();
                imgInput.src = URL.createObjectURL(blob);
                imgInput.onload = () => { 
                    desenhar(); 
                    loader.style.display = "none";
                    btn.disabled = false;
                    btn.style.opacity = "1";
                };
            } else {
                const erro = await response.json();
                alert("Erro: " + (erro.errors[0].title || "Verifique seus créditos"));
                loader.style.display = "none";
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        } catch (e) {
            alert("Falha na conexão com a IA.");
            loader.style.display = "none";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }

    function gerarGrade() {
        const cGrade = document.getElementById("canvas-grade");
        const ctxG = cGrade.getContext("2d");
        const fotoW = 354, fotoH = 472, gap = 15;
        cGrade.width = (fotoW * 3) + (gap * 2);
        cGrade.height = (fotoH * 2) + gap;
        ctxG.fillStyle = "white";
        ctxG.fillRect(0, 0, cGrade.width, cGrade.height);
        for (let i = 0; i < 6; i++) {
            let x = (i % 3) * (fotoW + gap);
            let y = Math.floor(i / 3) * (fotoH + gap);
            ctxG.drawImage(canvas, x, y, fotoW, fotoH);
        }
        document.getElementById("preview-final").style.display = "block";
    }

    function baixarPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgData = document.getElementById("canvas-grade").toDataURL("image/jpeg", 1.0);
        // Posiciona a grade centralizada no topo do A4
        pdf.addImage(imgData, "JPEG", 10, 10, 120, 105); 
        pdf.save("fotos_3x4_prontas.pdf");
    }
</script>
</body>
</html>
