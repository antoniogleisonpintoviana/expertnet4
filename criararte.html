<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Editor - ExpertNet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .editor-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-top: 0; font-size: 20px; }
        .canvas-wrapper {
            position: relative;
            width: 354px;
            height: 472px;
            margin: 20px auto;
            border: 2px dashed #ccc;
            overflow: hidden;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .canvas-wrapper:hover { border-color: #333; }
        #imagePreview {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        .placeholder-text {
            color: #888;
            font-size: 14px;
            padding: 20px;
            pointer-events: none;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        button:hover { background-color: #000; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        #btnCopiar {
            background-color: #28a745;
            display: none;
        }
        #btnCopiar:hover { background-color: #218838; }

        .loading { display: none; color: #666; font-size: 13px; margin-top: 10px; font-weight: bold; }
        
        #resultArea {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #dee2e6;
            text-align: left;
            font-size: 14px;
            display: none;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #333;
        }
    </style>
</head>
<body>

<div class="editor-container">
    <h2>Gemini 3 Flash Designer</h2>
    
    <div class="canvas-wrapper" id="dropArea" onclick="document.getElementById('imageUpload').click()">
        <span class="placeholder-text" id="placeholder">Clique para subir a imagem (354x472)</span>
        <img id="imagePreview" src="" alt="Preview">
    </div>
    
    <input type="file" id="imageUpload" accept="image/*" style="display: none">

    <div class="control-group">
        <textarea id="promptInput" placeholder="Ex: O que está escrito nesta imagem?"></textarea>
    </div>

    <button id="btnProcessar">Processar com Gemini 3</button>
    <button id="btnCopiar">📋 Copiar Texto</button>
    
    <div id="loadingStatus" class="loading">⚡ Processando com Gemini... aguarde.</div>
    <div id="resultArea"></div>
</div>


<script>
    const API_KEY = "AIzaSyDJIQdrha8Pi8T-iB0yDe-3yST7oBujKco"; 
    
    const imageUpload = document.getElementById('imageUpload');
    const imagePreview = document.getElementById('imagePreview');
    const placeholder = document.getElementById('placeholder');
    const btnProcessar = document.getElementById('btnProcessar');
    const btnCopiar = document.getElementById('btnCopiar');
    const loadingStatus = document.getElementById('loadingStatus');
    const resultArea = document.getElementById('resultArea');

    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imagePreview.style.display = 'block';
                placeholder.style.display = 'none';
                imagePreview.src = event.target.result;
                resultArea.style.display = 'none';
                btnCopiar.style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    });

    btnCopiar.addEventListener('click', () => {
        navigator.clipboard.writeText(resultArea.innerText).then(() => {
            const originalText = btnCopiar.innerText;
            btnCopiar.innerText = "✅ Copiado!";
            setTimeout(() => btnCopiar.innerText = originalText, 2000);
        });
    });

    btnProcessar.addEventListener('click', async () => {
        const prompt = document.getElementById('promptInput').value;
        
        if (!imagePreview.src || imagePreview.src === "") {
            alert("Selecione uma imagem primeiro!");
            return;
        }

        loadingStatus.style.display = 'block';
        btnProcessar.disabled = true;

        try {
            const parts = imagePreview.src.split(',');
            const mimeType = parts[0].match(/:(.*?);/)[1];
            const base64Data = parts[1];

            // URL ESTABILIZADA
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: prompt },
                            { inline_data: { mime_type: mimeType, data: base64Data } }
                        ]
                    }]
                })
            });

            const data = await response.json();

            if (data.error) {
                // Se der erro, vamos mostrar o código do erro para saber se é Permissão ou Modelo
                throw new Error(`[${data.error.code}] ${data.error.message}`);
            }

            if (data.candidates && data.candidates[0]) {
                const textResponse = data.candidates[0].content.parts[0].text;
                resultArea.innerText = textResponse;
                resultArea.style.display = 'block';
                btnCopiar.style.display = 'block';
            }

        } catch (error) {
            console.error("Erro detalhado:", error);
            alert("ExpertNet Info: " + error.message);
        } finally {
            loadingStatus.style.display = 'none';
            btnProcessar.disabled = false;
        }
    });
</script>
</body>
</html>
